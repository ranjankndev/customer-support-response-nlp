# retrieval_config.yaml — Retrieval pipeline configuration

# ── Input ─────────────────────────────────────────────────────────────────────
# CSV produced by aspect_extractor.py on train set
aspects_csv   : "output/aspect/aspects_train.csv"
# original train CSV — merged automatically to bring answer column back
train_csv     : "data/processed/cs-support-multi-train.csv"

# Column names in aspects CSV
col_ticket_id : "ticket_id"
col_subject   : "subject"
col_body      : "body"
col_response  : "answer"
col_language  : "language"
# aspect columns extracted by SFT model — used for reranking after retrieval
col_aspects   : ["prob_sub", "prob_statement", "cause", "intent", "ticket_type_nli"]

# ── Output paths ──────────────────────────────────────────────────────────────
index_path    : "data/index/faiss_index.bin"
metadata_path : "data/index/metadata.json"
# dense embedding matrix (row order = metadata order); aspect heads train on it
dense_path    : "data/index/dense.npy"

# BM25 index (retrieval_mode: hybrid); same row order as the FAISS index
bm25_path     : "data/index/bm25"
# gold columns of a past resolved ticket, stored for the aspect bonus
col_gold      : ["queue", "type", "priority"]
# body kept in metadata (capped) so the reranker can score ticket against ticket
metadata_body_max_chars: 1000
# rows that must never be indexed; the indexer asserts there is no overlap
exclude_idx_csvs: []

# ── Dense embedder ────────────────────────────────────────────────────────────
# BGE-M3: multilingual, no query/passage prefixes (E5 needs "query: "/"passage: ")
model_name    : "BAAI/bge-m3"
query_prefix  : ""
passage_prefix: ""
device        : "cuda"
batch_size    : 64
max_length    : 512
# max chars from body used in embedding text
body_max_chars: 1800

# ── Retriever ─────────────────────────────────────────────────────────────────
top_k              : 5
# dense = FAISS only | hybrid = FAISS + BM25 fused by reciprocal rank fusion
retrieval_mode     : "hybrid"
rrf_k              : 60
n_candidates       : 50
# if true, filter retrieved results to same language as query
filter_by_language : false       # false = retrieve across EN+DE (recommended for BGE-M3)
